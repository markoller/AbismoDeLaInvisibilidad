<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El abismo virtual</title>
    <link rel="stylesheet" type="text/css" href="style.css?audio=2">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>


    <script id="vertexShader" type="x-shader/x-vertex">
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPosition;
    
    #include <skinning_pars_vertex>
    
    void main() {
        #include <skinbase_vertex>
        #include <begin_vertex>
        #include <skinning_vertex>
        #include <project_vertex>
    
        vec4 modelPosition = modelMatrix * vec4(transformed, 1.0);
        vec4 viewPosition = viewMatrix * modelPosition;
        vec4 projectedPosition = projectionMatrix * viewPosition;
    
        gl_Position = projectedPosition;
    
        vUv = uv;
        vec4 modelNormal = modelMatrix * vec4(normal, 0.0);
        vNormal = modelNormal.xyz;
        vPosition = modelPosition.xyz;
    }
    </script>
    <script id="fragmentShader" type="x-shader/x-vertex">
    uniform float uTime;
    uniform vec3 uBaseColor;
    
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPosition;
    
    void main() {
        vec3 normal = normalize(vNormal);
        if(!gl_FrontFacing) {
            normal *= -1.0;
        }
    
        vec3 viewDirection = normalize(vPosition - cameraPosition);
        float fresnel = dot(viewDirection, normal) + 1.0;
        fresnel = pow(fresnel, 2.5);
    
        gl_FragColor = vec4(uBaseColor, fresnel);
    
        #include <colorspace_fragment>
    }
    </script>
    <script id="fragmentShaderNormal" type="x-shader/x-vertex">
    uniform vec3 uBaseColor;
    
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPosition;
    
    void main() {
        vec3 normal = normalize(vNormal);
        if(!gl_FrontFacing) {
            normal *= -1.0;
        }
    
        gl_FragColor = vec4(uBaseColor,1.0);
    
        #include <colorspace_fragment>
    }
    </script>
</head>
<body>
    <div id="joystickZona"></div>
    <div id="error"></div>
    <div id="target"></div>
    <!-- DIAGNÓSTICO AUDIO v2: visible incluso si falla el módulo de la escena. -->
    <details id="audio-debug" open lang="es">
        <summary>Audio · prueba 2</summary>
        <div class="audio-debug-content">
            <p id="audio-debug-status" role="status">HTML actualizado. Esperando JavaScript de diagnóstico…</p>
            <div class="audio-debug-actions">
                <button id="audio-debug-enable" type="button" disabled>Activar audio</button>
                <button id="audio-debug-tone" type="button" disabled>Probar tono</button>
                <button id="audio-debug-copy" type="button" disabled>Copiar diagnóstico</button>
            </div>
            <p>Pitido independiente de los WAV. Tocá el título para plegar el panel.</p>
            <pre id="audio-debug-report">Versión HTML: audio-v2</pre>
        </div>
    </details>
    <script src="audio-diagnostics.js?audio=2"></script>
    <script type="module" src="main.js?audio=2"></script>
</body>
</html>
