<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    // CAMBIO AUDIO v6: escuchar el primer gesto ANTES de descargar Three.js
    // y la escena. El contexto habilitado aquí se reutiliza en AudioIniciar().
    // No se guarda un clic para simularlo después: resume() ocurre en el gesto real.
    (() => {
        const eventos = ['touchstart', 'pointerdown', 'mousedown', 'pointerup', 'touchend', 'click', 'keydown'];
        const opciones = {capture: true, passive: true};
        let fuente = null;
        const arranque = window.AudioArranque = {
            contexto: null,
            primerGesto: null,
            error: null,
            finalizar() {
                for (const evento of eventos) window.removeEventListener(evento, activar, opciones);
            },
        };
        function activar(evento) {
            if (!evento.isTrusted) return;
            if (!arranque.primerGesto) {
                arranque.primerGesto = `${evento.type}; destino ${evento.target?.id || evento.target?.tagName || 'pantalla'}`;
            }
            try {
                const TipoContexto = window.AudioContext || window.webkitAudioContext;
                if (!TipoContexto) return;
                try {
                    if (navigator.audioSession) navigator.audioSession.type = 'playback';
                } catch (error) {
                    arranque.error = `AudioSession: ${error.message}`;
                }
                if (!arranque.contexto || arranque.contexto.state === 'closed') {
                    arranque.contexto = new TipoContexto();
                }
                const contexto = arranque.contexto;
                if (contexto.state === 'running') return;
                if (!fuente) {
                    fuente = contexto.createBufferSource();
                    fuente.buffer = contexto.createBuffer(1, 1, contexto.sampleRate);
                    fuente.connect(contexto.destination);
                    fuente.onended = () => {
                        fuente.disconnect();
                        fuente = null;
                    };
                    fuente.start(0);
                }
                contexto.resume().catch(error => {
                    arranque.error = error.message;
                });
            } catch (error) {
                arranque.error = error.message;
            }
        }
        for (const evento of eventos) window.addEventListener(evento, activar, opciones);
    })();
    </script>
    <title>El abismo virtual</title>
    <link rel="stylesheet" type="text/css" href="style.css?audio=publicacion-3">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
    }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>


    <script id="vertexShader" type="x-shader/x-vertex">
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPosition;
    
    #include <skinning_pars_vertex>
    
    void main() {
        #include <skinbase_vertex>
        #include <begin_vertex>
        #include <skinning_vertex>
        #include <project_vertex>
    
        vec4 modelPosition = modelMatrix * vec4(transformed, 1.0);
        vec4 viewPosition = viewMatrix * modelPosition;
        vec4 projectedPosition = projectionMatrix * viewPosition;
    
        gl_Position = projectedPosition;
    
        vUv = uv;
        vec4 modelNormal = modelMatrix * vec4(normal, 0.0);
        vNormal = modelNormal.xyz;
        vPosition = modelPosition.xyz;
    }
    </script>
    <script id="fragmentShader" type="x-shader/x-vertex">
    uniform float uTime;
    uniform vec3 uBaseColor;
    
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPosition;
    
    void main() {
        vec3 normal = normalize(vNormal);
        if(!gl_FrontFacing) {
            normal *= -1.0;
        }
    
        vec3 viewDirection = normalize(vPosition - cameraPosition);
        float fresnel = dot(viewDirection, normal) + 1.0;
        fresnel = pow(fresnel, 2.5);
    
        gl_FragColor = vec4(uBaseColor, fresnel);
    
        #include <colorspace_fragment>
    }
    </script>
    <script id="fragmentShaderNormal" type="x-shader/x-vertex">
    uniform vec3 uBaseColor;
    
    varying vec2 vUv;
    varying vec3 vNormal;
    varying vec3 vPosition;
    
    void main() {
        vec3 normal = normalize(vNormal);
        if(!gl_FrontFacing) {
            normal *= -1.0;
        }
    
        gl_FragColor = vec4(uBaseColor,1.0);
    
        #include <colorspace_fragment>
    }
    </script>
</head>
<body>
    <div id="joystickZona"></div>
    <div id="error"></div>
    <div id="target"></div>
    <script type="module" src="main.js?audio=publicacion-3"></script>
</body>
</html>
